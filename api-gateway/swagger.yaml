openapi: 3.0.0
info:
  title: Distributed Parcel Delivery & Tracking System
  version: 2.0.0
  description: |
    Unified API Documentation for the Distributed Parcel Delivery System.
    Access through the API Gateway.

servers:
  - url: http://localhost/api
    description: API Gateway (Nginx Entry Point)

tags:
  - name: Authentication
    description: User signup, login, token refresh
  - name: Users
    description: Manage user profiles
  - name: Orders
    description: Parcel delivery lifecycle and estimation
  - name: Payments
    description: Financial transactions and pricing rules

paths:
  ###############################################
  # AUTH
  ###############################################
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: Created
  
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Success

  ###############################################
  # ORDERS
  ###############################################
  /orders:
    get:
      tags: [Orders]
      summary: Get all orders
      responses:
        "200":
          description: List of orders
    post:
      tags: [Orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        "201":
          description: Created

  /orders/estimate-price:
    post:
      tags: [Orders]
      summary: Estimate delivery price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pickupLocation: { type: string }
                dropoffLocation: { type: string }
                weight: { type: number }
                priority: { type: string }
      responses:
        "200":
          description: Price estimation

  /orders/my-orders:
    get:
      tags: [Orders]
      summary: Get customer's orders
      responses:
        "200":
          description: Success

  /orders/courier-orders:
    get:
      tags: [Orders]
      summary: Get courier's assigned orders
      responses:
        "200":
          description: Success

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
      responses:
        "200":
          description: Success

  ###############################################
  # PAYMENTS
  ###############################################
  /payments/initiate:
    post:
      tags: [Payments]
      summary: Initiate payment via Chapa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId: { type: string }
                amount: { type: number }
                email: { type: string }
      responses:
        "200":
          description: Success

  /payments/mock-success:
    post:
      tags: [Payments]
      summary: Simulate successful payment (Dev only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId: { type: string }
      responses:
        "200":
          description: Success

components:
  schemas:
    RegisterRequest:
      type: object
      required: [first_name, last_name, email, password, phone_number, user_role]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
        password: { type: string }
        phone_number: { type: string }
        user_role: { type: string, enum: [CUSTOMER, COURIER] }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    OrderCreateRequest:
      type: object
      required: [pickupLocation, dropoffLocation, weight, receiverName, receiverPhone]
      properties:
        pickupLocation: { type: string }
        dropoffLocation: { type: string }
        receiverName: { type: string }
        receiverPhone: { type: string }
        weight: { type: number }
        description: { type: string }
        priority: { type: string, enum: [NORMAL, URGENT] }
