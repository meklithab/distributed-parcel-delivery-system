name: CI

on:
  push:
    branches: [ main, feature/ui-ux-polish ]
  pull_request:
    branches: [ main ]

jobs:
  build-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, notification-service, order-service, payment-service, user-service]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './${{ matrix.service }}/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        working-directory: ./${{ matrix.service }}
        
      - name: Generate Prisma Client
        if: contains(matrix.service, 'service') && matrix.service != 'notification-service'
        run: npx prisma generate
        working-directory: ./${{ matrix.service }}
        
      - name: Build service
        run: npm run build
        working-directory: ./${{ matrix.service }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
        
      - name: Build frontend
        run: npm run build
        working-directory: ./frontend
