
services:
  # User Management Service
  user-service:
    build: ./user-services
    container_name: user-service-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=user-db
      - DB_PORT=5432
      - DB_NAME=user_service_db
      - DB_USER=delivery_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=postgresql://delivery_user:${DB_PASSWORD}@user-db:5432/user_service_db?schema=public
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - user-db
    restart: unless-stopped

  # PostgreSQL Database for User Service
  user-db:
    image: postgres:15-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init_scripts/01_init_user_db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # PostgreSQL Database for Order Service
  postgres-order:
    image: postgres:15-alpine
    container_name: order-service
    environment:
      POSTGRES_DB: order_service_db
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"  # Different host port
    volumes:
      - ./db/init_scripts/02_init_order_db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # PostgreSQL Database for Payment Service
  postgres-payment:
    image: postgres:15-alpine
    container_name: payment-service
    environment:
      POSTGRES_DB: payment_service_db
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"  # Different host port
    volumes:
      - ./db/init_scripts/03_init_payment_db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped