openapi: 3.0.0
info:
  title: Distributed Parcel Delivery & Tracking System
  version: 1.0.1
  description: |
    OpenAPI 3.0 spec updated to reflect implemented backend endpoints.

servers:
  - url: http://localhost:3001
    description: user-service (auth, users)
  - url: http://localhost:3002
    description: order-service
  - url: http://localhost:3003
    description: payment-service

tags:
  - name: Authentication
    description: User signup and login
  - name: Users
    description: User profile, addresses and courier/customer actions
  - name: Orders
    description: Create and manage orders
  - name: Payments
    description: Payment initiation and pricing

paths:

  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user (customer or courier)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { description: Bad request }

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login and receive token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401': { description: Invalid credentials }

  # User endpoints (mounted under /api/users)
  /api/users/me:
    get:
      tags: [Users]
      summary: Get authenticated user's profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put:
      tags: [Users]
      summary: Update authenticated user's profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200': { description: Updated }
    delete:
      tags: [Users]
      summary: Delete authenticated user's account
      responses:
        '200': { description: Deleted }

  /api/users/profile:
    get:
      tags: [Users]
      summary: Alias for /api/users/me
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  # Customer-specific endpoints (mounted under /api/customers)
  /api/customers/me/profile:
    get:
      tags: [Users]
      summary: Get customer profile (includes addresses)
      responses:
        '200':
          description: Customer profile with addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: '#/components/schemas/UserProfile' }
                  addresses:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }

  /api/customers/me/addresses:
    get:
      tags: [Users]
      summary: List addresses for authenticated customer
      responses:
        '200':
          description: List of addresses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
    post:
      tags: [Users]
      summary: Add an address for the authenticated customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreate'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }

  # Courier-specific
  /api/couriers/me/profile:
    get:
      tags: [Users]
      summary: Get courier profile
      responses:
        '200':
          description: Courier profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourierProfile'

  /api/couriers/me/status:
    put:
      tags: [Users]
      summary: Update courier status
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
      responses:
        '200': { description: Updated }

  /api/couriers/me/location:
    put:
      tags: [Users]
      summary: Update courier location
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude: { type: number }
                longitude: { type: number }
      responses:
        '200': { description: Updated }

  /api/couriers/me/vehicles:
    post:
      tags: [Users]
      summary: Add vehicle for courier
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                make: { type: string }
                model: { type: string }
                plateNumber: { type: string }
      responses:
        '201': { description: Vehicle added }

  /api/couriers/me/availability:
    post:
      tags: [Users]
      summary: Set courier availability
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
      responses:
        '200': { description: Availability recorded }

  ########################################
  # Orders
  ########################################

  /api/orders/estimate-price:
    post:
      tags: [Orders]
      summary: Estimate delivery price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceEstimateRequest'
      responses:
        '200':
          description: Price estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceEstimateResponse'

  /api/orders:
    post:
      tags: [Orders]
      summary: Create order (customer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    get:
      tags: [Orders]
      summary: Get orders (filters available)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: priority
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: string }
        - name: courierId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Orders list with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  pagination:
                    type: object

  /api/orders/my-orders:
    get:
      tags: [Orders]
      summary: Get authenticated customer's orders
      responses:
        '200':
          description: Customer orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }

  /api/orders/courier-orders:
    get:
      tags: [Orders]
      summary: Get courier's orders
      responses:
        '200': { description: Orders for courier }

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Order object
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }

  /api/orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status (courier)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
                notes: { type: string }
                latitude: { type: number }
                longitude: { type: number }
      responses:
        '200': { description: Updated order }

  /api/orders/{id}/cancel:
    patch:
      tags: [Orders]
      summary: Cancel an order (customer)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Order cancelled }

  /api/orders/{id}/assign-courier:
    patch:
      tags: [Orders]
      summary: Assign courier to order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                courierId: { type: string }
                vehicleId: { type: string }
      responses:
        '200': { description: Courier assigned }

  ########################################
  # Payments
  ########################################

  /api/payments/initiate:
    post:
      tags: [Payments]
      summary: Initiate payment for an order
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId: { type: string }
                amount: { type: number }
      responses:
        '200': { description: Payment initiated }

  /api/payments/mock-success:
    post:
      tags: [Payments]
      summary: Dev endpoint to simulate payment success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId: { type: string }
      responses:
        '200': { description: Payment processed (mock) }

  /api/payments/verify:
    get:
      tags: [Payments]
      summary: Verify payment (callback)
      responses:
        '200': { description: Verification result }

  /api/payments/order/{orderId}:
    get:
      tags: [Payments]
      summary: Get payment details for an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Payment info }

  /api/payments/calculate-fee:
    post:
      tags: [Payments]
      summary: Calculate delivery fee for parcels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parcels:
                  type: array
                  items:
                    type: object
                    properties:
                      weightKg: { type: number }
                      isFragile: { type: boolean }
                      declaredValue: { type: number }
      responses:
        '200':
          description: Fee calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceEstimateResponse'

  /api/payments/pricing-rules:
    get:
      tags: [Payments]
      summary: Get current pricing rules
      responses:
        '200': { description: Pricing rules object }

  /api/payments/calculation/{orderId}:
    get:
      tags: [Payments]
      summary: Get stored fee calculation for an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Calculation object }

components:
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, first_name, last_name, phone_number]
      properties:
        email: { type: string }
        password: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        phone_number: { type: string }
        user_role:
          type: string
          enum: [CUSTOMER, COURIER]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    User:
      type: object
      properties:
        user_id: { type: string }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        phone_number: { type: string }
        user_role: { type: string }

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            is_active: { type: boolean }
            is_verified: { type: boolean }

    UserUpdate:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        phone_number: { type: string }

    Address:
      type: object
      properties:
        address_id: { type: string }
        address_type: { type: string }
        street_address: { type: string }
        subcity: { type: string }
        kebele: { type: string }
        house_number: { type: string }
        landmark: { type: string }
        instructions: { type: string }

    AddressCreate:
      type: object
      required: [address_type, street_address]
      properties:
        address_type: { type: string }
        street_address: { type: string }
        contact_name: { type: string }
        contact_phone: { type: string }

    CourierProfile:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        status: { type: string }

    PriceEstimateRequest:
      type: object
      required: [parcels]
      properties:
        priority: { type: string }
        serviceType: { type: string }
        parcels:
          type: array
          items:
            type: object
            properties:
              weightKg: { type: number }
              isFragile: { type: boolean }
              isPerishable: { type: boolean }
              requiresSignature: { type: boolean }
              declaredValue: { type: number }

    PriceEstimateResponse:
      type: object
      properties:
        estimatedPrice: { type: number }
        breakdown: { type: object }

    OrderCreateRequest:
      type: object
      required: [addresses, parcels]
      properties:
        priority: { type: string }
        serviceType: { type: string }
        scheduledPickupTime: { type: string, format: date-time }
        scheduledDeliveryTime: { type: string, format: date-time }
        notes: { type: string }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/AddressCreate' }
        parcels:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              weightKg: { type: number }
              lengthCm: { type: number }
              widthCm: { type: number }
              heightCm: { type: number }
              declaredValue: { type: number }
              category: { type: string }
              isFragile: { type: boolean }
              isPerishable: { type: boolean }
              requiresSignature: { type: boolean }

    Order:
      type: object
      properties:
        orderId: { type: string }
        orderNumber: { type: string }
        customerId: { type: string }
        status: { type: string }
        priority: { type: string }
        serviceType: { type: string }
        price: { type: number }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/Address' }
        parcels:
          type: array
          items:
            type: object
            properties:
              parcelNumber: { type: string }
              description: { type: string }
              weightKg: { type: number }

